// 포지 공식 MDK(1.21.10, ForgeGradle 7) 구조 기반
plugins {
    id 'java'
    id 'idea'
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[7.0.3,8)'
}

version = mod_version
group = maven_group
base { archivesName = archives_base_name }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

minecraft {
    mappings channel: 'official', version: minecraft_version

    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')
        }
        register('client')
        register('server') { args '--nogui' }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    maven { name = 'GeckoLib'; url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
    mavenCentral()
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")
    implementation "software.bernie.geckolib:geckolib-forge-${minecraft_version}:${geckolib_version}"
}

tasks.named('processResources', ProcessResources).configure {
    def props = [mod_id: mod_id, mod_version: mod_version, geckolib_version: geckolib_version]
    inputs.properties props
    filesMatching('META-INF/mods.toml') { expand props }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

// 믹스인 설정 (포지는 jar 매니페스트의 MixinConfigs 로 로드)
tasks.named('jar', Jar).configure {
    manifest { attributes('MixinConfigs': 'jjk.mixins.json') }
}

// 시뮬레이션 코어(Minecraft 비의존) 자체 검증
tasks.register('simTest', JavaExec) {
    group = 'verification'
    classpath = sourceSets.main.output + sourceSets.test.output
    mainClass = 'com.tubilt.jjk.sim.SimSelfTest'
    jvmArgs '-Dstdout.encoding=UTF-8'
}

// 건축물 소환기 핵심 로직(변환·정책·고정 설계도·회전 후 기계 네트워크) 자체 검증
tasks.register('bpTest', JavaExec) {
    group = 'verification'
    classpath = sourceSets.main.output + sourceSets.test.output
    mainClass = 'com.tubilt.jjk.blueprint.BpSelfTest'
    workingDir = layout.projectDirectory
    jvmArgs '-Dstdout.encoding=UTF-8'
}

// src/test 는 JUnit 이 아닌 main() 자체 검증 → test 태스크 대신 simTest·bpTest 로 검증 (Gradle 9: 빈 test 는 실패 처리)
tasks.named('test', Test).configure { failOnNoDiscoveredTests = false }
tasks.named('check').configure { dependsOn 'simTest', 'bpTest' }
